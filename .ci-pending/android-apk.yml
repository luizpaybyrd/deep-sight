name: Android APK

# Produces a sideloadable debug APK. Unlike iOS this needs no paid account —
# enable "install unknown apps" on the phone and open the file.
on:
  workflow_dispatch:
  push:
    paths: ['www/**', 'android/**', 'package.json', 'capacitor.config.json']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Install deps and sync
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: deep-sight-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
